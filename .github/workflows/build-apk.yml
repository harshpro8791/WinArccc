name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate app icon and splash
        run: |
          npx -y @capacitor/assets generate --android \
            --iconBackgroundColor '#0b0d12' --iconBackgroundColorDark '#0b0d12' \
            --splashBackgroundColor '#0b0d12' --splashBackgroundColorDark '#0b0d12'
          npx cap sync android

      - name: Build debug APK
      
